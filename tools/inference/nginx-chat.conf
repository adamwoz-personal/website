# nginx location block for the chat service. Included from the main server block.

# Per-IP rate zone: 30 req/min sustained, 10-req burst. Belt-and-suspenders on
# top of the app's own per-IP limiter.
limit_req_zone $binary_remote_addr zone=chat_zone:10m rate=30r/m;

